# Environnement local de développement (nécessite Docker). Ne pas utiliser tel quel en production.
services:
  mongo:
    image: mongo:7           # MongoDB Community (licence SSPL) : serveur de base de données, non lié au code du projet
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  api:
    build: ./backend
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/pharmaloc
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-0123456789
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me-0123456789
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: [mongo]
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000/api }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  mongo-data:
